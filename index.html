<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almonzer Hamid | Web Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'sans': ['Poppins', 'sans-serif'],
              'display': ['Orbitron', 'sans-serif'],
            },
            colors: {
              'background': '#0a0a0a',
              'primary': '#1a1a1a',
              'accent': '#00f5c3',
              'accent-purple': '#9333ea',
              'text-primary': '#e0e0e0',
              'text-secondary': '#a0a0a0',
            },
            animation: {
              'gradient-x': 'gradient-x 15s ease infinite',
              'text-shine': 'text-shine 2s linear infinite',
            },
            keyframes: {
              'gradient-x': {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center',
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center',
                },
              },
               'text-shine': {
                '0%': {
                  'background-position': '0% 50%',
                },
                '100%': {
                  'background-position': '100% 50%',
                },
              },
            },
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",

    "three": "https://aistudiocdn.com/three@^0.180.0",

    "@react-three/fiber": "https://aistudiocdn.com/@react-three/fiber@^9.3.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.22",
    "react-parallax-tilt": "https://aistudiocdn.com/react-parallax-tilt@^1.7.309"
  }
}
</script>
</head>
  <body class="bg-background text-text-primary">
    <div id="root"></div>

  </body>
</html>
